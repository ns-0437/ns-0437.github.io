<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found | Navin Kumar</title>
<meta name="robots" content="noindex" />

<link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/img/favicon.ico" sizes="32x32" />
<meta name="theme-color" content="#fffcf5" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#12110e" media="(prefers-color-scheme: dark)" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Sora:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/main.css" />

<script>
  (function () {
    var t = localStorage.getItem('theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>

<style>
  .nf {
    min-height: 100vh;
    display: grid;
    place-content: center;
    text-align: center;
    padding: 2rem;
  }
  .nf-code {
    font-family: var(--font-mono);
    font-size: .78rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 1.2rem;
  }
  .nf-title {
    font-family: var(--font-serif);
    font-size: clamp(2rem, 6vw, 3rem);
    font-weight: 700;
    letter-spacing: -.01em;
    margin-bottom: .9rem;
  }
  .nf-body {
    color: var(--text-muted);
    max-width: 44ch;
    margin: 0 auto 2rem;
  }
</style>
</head>

<body>
<main class="nf">
  <p class="nf-code">Error 404</p>
  <h1 class="nf-title">This page doesn't exist</h1>
  <p class="nf-body">
    The link is either mistyped or points at something that has since moved.
    Everything on this site lives on one page.
  </p>
  <p><a class="btn btn-primary" href="/">Back to the start</a></p>
</main>
</body>
</html>
